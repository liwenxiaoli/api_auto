[pytest]
# 默认只扫 testcases 目录
testpaths = testcases

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 让 -v 输出更好看，并打印 print / 日志
addopts = -v --strict-markers
# 开启后，pytest 会把日志按用例分组显示：每条用例的请求/响应归到一起，不再和 PASSED 混行
log_cli = true
log_cli_level = INFO

markers =
    smoke: 冒烟用例，每次提代码都要跑
    regression: 回归用例，全量跑
    serial: 有顺序依赖，不能并发（xdist 时用）