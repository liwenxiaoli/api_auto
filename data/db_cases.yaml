- case: 创建商品后数据库里应有该记录
  feature: 数据库校验
  story: 创建
  marks: [mock]
  request:
    method: POST
    path: /products
    json: {name: 小米15, price: 4999, stock: 30}
  expect_status: 201
  extract:
    product_id: $.id
  expect:
    $.name: 小米15
  db_assert:
    sql: SELECT name, price, stock FROM products WHERE id = ${product_id}
    expect: [小米15, 4999, 30]
  cleanup:
    method: DELETE
    path: /products/${product_id}



- case: 删除商品后数据库里应查不到
  feature: 数据库校验
  story: 删除
  marks: [mock]
  request:
    method: DELETE
    path: /products/${product_id}
  expect_status: 200
  db_assert:
    sql: SELECT id, name FROM products WHERE id = ${product_id}
    expect: null


- case: 删除不存在的商品应返回404
  feature: 数据库校验
  story: 删除-异常
  marks: [mock]
  request:
    method: DELETE       # 填：DELETE
    path: /products/99999             # 一个不可能存在的 id
  expect_status: 404             # 填：404（你的 mock 里 rowcount==0 时返回的就是它）
  db_assert:
    sql: SELECT id FROM products WHERE id = 99999
    expect: null
