name: 冒烟测试



on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑冒烟
        run: |
          python -m pytest -m "smoke and not mock" -q --reruns 2 --reruns-delay 1
